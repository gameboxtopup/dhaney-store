<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dhaney Cheats</title>
<style>
:root{--bg:#0b0b12;--card:#14141f;--line:#262636;--tx:#e9e9f2;--mu:#8b8ba3;--ac:#ff3b4e;--ac2:#ffb020;--ok:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:5;background:#0b0b12ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.w{max-width:1100px;margin:auto;padding:0 16px}.nav{display:flex;align-items:center;gap:20px;height:60px}.nav .sp{flex:1}.nav a.l{color:var(--mu)}.nav a.l:hover{color:#fff}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:1px}.logo img{height:36px}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer}.btn.g{background:transparent;border:1px solid var(--line)}.btn.s{padding:6px 12px;font-size:13px}.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pc{cursor:pointer;transition:.15s}.pc:hover{transform:translateY(-3px);border-color:var(--ac)}.pc img{width:100%;aspect-ratio:1;object-fit:cover;background:#000}.pc .b{padding:12px}
.tag{display:inline-block;background:var(--ac);font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700}.old{color:var(--mu);text-decoration:line-through;margin-right:6px}.price{font-weight:700;color:var(--ac2)}
h1,h2{margin:28px 0 14px}input,select,textarea{width:100%;background:#0e0e17;border:1px solid var(--line);color:var(--tx);padding:10px;border-radius:8px;font:inherit;margin:4px 0 10px}label{font-size:13px;color:var(--mu)}
.hero{padding:56px 0;text-align:center;background:radial-gradient(circle at 50% 0,#3a0f1a,transparent 60%)}.hero h1{font-size:40px;margin:0 0 8px}.hero p{color:var(--mu)}
.pill{display:inline-block;border:1px solid var(--line);padding:6px 14px;border-radius:99px;margin:3px;cursor:pointer;color:var(--mu)}.pill.on{border-color:var(--ac);color:#fff;background:#ff3b4e22}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}@media(max-width:760px){.two{grid-template-columns:1fr}.hero h1{font-size:28px}.nav{flex-wrap:wrap;height:auto;padding:8px 0;gap:6px 10px}.nl{order:3;width:100%;gap:18px!important;font-size:14px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.w{padding:0 12px}}
.nl{display:flex;gap:20px}table{display:block;overflow-x:auto}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}.modal>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:420px;width:100%;max-height:92vh;overflow:auto}
.st{font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700;background:#444}.st.completed{background:var(--ok)}.st.pending{background:#b8860b}.st.canceled{background:#a33}.st.processing{background:#2563eb}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
.opt{display:inline-block;border:1px solid var(--line);padding:8px 14px;border-radius:8px;margin:3px;cursor:pointer}.opt.on{border-color:var(--ac);background:#ff3b4e22}
.pm{display:flex;gap:8px}.pm div{flex:1;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600}.pm div.on{border-color:var(--ac);background:#ff3b4e22}
pre{white-space:pre-wrap;background:#0e0e17;border:1px dashed var(--ok);padding:10px;border-radius:8px;user-select:all}.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:10px}
footer{border-top:1px solid var(--line);margin-top:50px;padding:24px 0;color:var(--mu);font-size:13px}.err{color:#ff6b78;font-size:13px;min-height:18px}
.wa{position:fixed;right:18px;bottom:18px;background:#25d366;color:#fff;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 14px #0008}
#soc{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:9}
#soc a{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #0008;transition:.15s}#soc a:hover{transform:scale(1.12)}#soc svg{width:24px;height:24px}
@media(max-width:760px){#soc{right:8px;gap:8px}#soc a{width:36px;height:36px}#soc svg{width:20px;height:20px}#soc span{font-size:19px!important}}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.pill{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;background:#ffffff08}
.pill.on{background:var(--ac2);border-color:var(--ac2);color:#111}
.sec{text-align:center;color:var(--ac2);letter-spacing:2px;font-size:15px;margin:26px 0 18px}.sec:after{content:"";display:block;width:50px;height:3px;background:var(--ac2);margin:8px auto 0;border-radius:3px}
.live{position:absolute;right:8px;top:8px;background:#052e16;color:#22c55e;border:1px solid #166534;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;z-index:1}
.pc .desc{color:var(--mu);font-size:12px;margin:4px 0 8px;min-height:32px;overflow:hidden}.cb{display:flex;flex-direction:column;gap:6px;margin-top:10px}.cb .btn{width:100%;font-size:12px;padding:9px}.btn.o{background:#ffffff0d;border:1px solid var(--line);color:#ddd}
.opt.out{opacity:.55;text-decoration:line-through;cursor:not-allowed}.oos{display:inline-block;background:#7f1d1d;color:#fecaca;font-size:10px;padding:1px 7px;border-radius:99px;margin-left:6px}
.lo{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:760px){.lo{grid-template-columns:1fr}}
.lo-item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.lo-item.new{animation:pop .6s ease}@keyframes pop{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.lp{color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vtag{background:#ffffff12;padding:1px 6px;border-radius:6px}
.done{background:#052e16;color:#22c55e;border:1px solid #166534;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
#pp:empty{display:none}#pp{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);z-index:40;display:flex;align-items:center;justify-content:center;padding:14px}
#pp .pb{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;max-width:380px;width:100%;overflow:hidden;box-shadow:0 20px 60px #000;animation:ppin .25s}
#pp .px{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:18px;cursor:pointer;z-index:2}#pp .px:hover{background:#000}
#pp .ph{height:150px;display:flex;align-items:center;justify-content:center}#pp .ph.im{height:auto}#pp .ph img{width:100%;display:block}#pp .ph svg{width:72px;height:72px}
#pp .pt{padding:18px 20px 22px;text-align:center}#pp .pt h3{margin:0 0 8px}#pp .pt p{color:var(--mu);font-size:14px;margin:0 0 16px}#pp .go{display:block;color:#fff;padding:13px;border-radius:12px;font-weight:700}
@keyframes ppin{from{transform:scale(.92);opacity:0}}
</style></head><body>
<header><div class="w nav"><a href="#/" class="logo" id="logo"></a><span class="sp"></span>
<div class="nl"><a class="l" href="#/">Home</a><a class="l" href="#/shop">Shop</a><a class="l" href="#/faq">FAQ / Tutorials</a></div><span id="auth"></span></div></header>
<main class="w" id="app"></main>
<footer><div class="w">© <span id="fb"></span> — Digital products, delivered to your account. Need help? Contact us on WhatsApp.</div></footer>
<a class="wa" id="wa" target="_blank" rel="noopener">✆</a><div id="pp" onclick="if(event.target===this)closeCur()"></div><div id="soc"></div><div id="mod"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');let S={},P=[],FQ=[],RV=[],U=null,cat='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,m='GET',b)=>{const r=await fetch('/api/'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error');return j};
const rs=n=>'Rs '+Number(n).toLocaleString();const SOC={telegram:['#229ed9','Telegram','<svg viewBox="0 0 24 24"><path d="M3 11.5 21 4l-3.2 15-5.3-4-2.7 2.5-.8-4.2z" fill="#fff"/><path d="M9.5 13.8 17 7.5l-6.8 7.2z" fill="#229ed9"/></svg>'],discord:['#5865f2','Discord','<svg viewBox="0 0 24 24"><path fill="#fff" d="M5 6c2-1.2 4-1.5 4-1.5l.5 1c1-.15 2-.15 3 0l.5-1s2 .3 4 1.5c2.5 3 3.500 6.500 3.300 10-1.600 1.200-3.200 1.700-3.200 1.700l-.8-1.300c.5-.2 1-.5 1.400-.8-1.800.8-3.600 1.200-5.500 1.200s-3.700-.4-5.500-1.200c.4.3.9.6 1.400.8l-.8 1.300S3.300 17.200 1.700 16C1.500 12.500 2.500 9 5 6z"/><circle cx="9" cy="12.300" r="1.700" fill="#5865f2"/><circle cx="15" cy="12.300" r="1.700" fill="#5865f2"/></svg>'],
 tiktok:['#000','TikTok','<span style="font-size:24px;font-weight:800;color:#fff;text-shadow:2px 2px #ff0050,-2px -2px #00f2ea">♪</span>'],
 youtube:['#f00','YouTube','<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4" fill="#fff"/><path d="M10 9l5 3-5 3z" fill="#f00"/></svg>'],
 facebook:['#1877f2','Facebook','<svg viewBox="0 0 24 24"><path fill="#fff" d="M24 12.070C24 5.400 18.630 0 12 0S0 5.400 0 12.070C0 18.100 4.390 23.100 10.130 24v-8.440H7.080v-3.490h3.050V9.410c0-3.020 1.800-4.700 4.540-4.700 1.310 0 2.680.240 2.680.240v2.970h-1.500c-1.500 0-1.960.930-1.960 1.890v2.260h3.330l-.530 3.500h-2.800V24C19.620 23.100 24 18.100 24 12.070z"/></svg>']};
function socials(){const s=S.social||{};$('#soc').innerHTML=Object.keys(SOC).filter(k=>/^https?:/.test(s[k]||'')).map(k=>`<a href="${esc(s[k])}" target="_blank" rel="noopener" title="${SOC[k][1]}" style="background:${SOC[k][0]}">${SOC[k][2]}</a>`).join('')}
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function reviews(p){const L=RV.filter(r=>r.productId==p.id),avg=L.length?(L.reduce((a,r)=>a+r.rating,0)/L.length).toFixed(1):'';
 return`<div class="card" style="padding:18px;margin-top:24px"><h3 style="margin-top:0">Customer reviews ${L.length?`<span style="color:var(--ac2)">★ ${avg}</span> <small style="color:var(--mu)">(${L.length})</small>`:''}</h3>${L.map(r=>`<div style="border-top:1px solid var(--line);padding:10px 0"><span style="color:var(--ac2)">${stars(r.rating)}</span> <b>${esc(r.name)}</b> ${U&&U.role=='admin'?`<a href="#" style="color:#f87171" onclick="delRev('${r.id}');return false">✕ delete</a>`:''}<div style="color:#c9c9d8">${esc(r.text)}</div></div>`).join('')||'<p style="color:var(--mu)">No reviews yet.</p>'}
 ${U?`<div style="border-top:1px solid var(--line);padding-top:12px"><label>Your rating</label><select id="rr">${[5,4,3,2,1].map(n=>`<option value="${n}">${stars(n)}</option>`).join('')}</select><textarea id="rt" rows="2" placeholder="Write your review (customers with a completed order)"></textarea><div class="err" id="re"></div><button class="btn s" onclick="sendRev('${p.id}')">Submit review</button></div>`:'<p style="color:var(--mu)">Log in to write a review.</p>'}</div>`}
async function sendRev(id){try{await api('reviews','POST',{productId:id,rating:+$('#rr').value,text:$('#rt').value});await boot()}catch(e){$('#re').textContent=e.message}}
const delRev=async id=>{await api('admin/reviews/'+id,'DELETE');await boot()};
const gal=p=>p.imgs&&p.imgs.length?p.imgs:[p.img];
const fileData=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>{const i=new Image();i.onload=()=>{const m=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*m;c.height=i.height*m;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};i.src=x.result};x.readAsDataURL(f)});
function video(u){if(!u)return'';let m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);if(m)return`<iframe class="vid" src="https://www.youtube.com/embed/${m[1]}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><div style="margin-top:8px"><a style="color:var(--ac2);font-size:13px" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${m[1]}">▶ Not playing? Open on YouTube</a></div>`;return/^https?:/.test(u)?`<a class="btn g" target="_blank" rel="noopener" href="${esc(u)}">▶ Watch video</a>`:''}
const logoHtml=()=>S.logo?`<img src="${S.logo}" alt="">`:`<svg height="34" viewBox="0 0 40 40"><path d="M20 2 36 10v14c0 8-7 12-16 14C11 36 4 32 4 24V10z" fill="#ff3b4e"/><path d="M12 12h8c6 0 9 3 9 8s-3 8-9 8h-8zm5 4v8h3c3 0 4-2 4-4s-1-4-4-4z" fill="#fff"/></svg><span>${esc(S.brand)}</span>`;
async function boot(){const d=await api('public');S=d.settings;P=d.products;FQ=d.faqs;RV=d.reviews||[];U=await api('me');document.title=S.brand;$('#logo').innerHTML=logoHtml();$('#fb').textContent=S.brand;
 $('#wa').href='https://wa.me/'+(S.whatsapp||'').replace(/\D/g,'');$('#wa').style.display=S.whatsapp?'flex':'none';socials();
 $('#auth').innerHTML=U?`<a class="btn g s" href="#/account">👤 My Orders</a> ${U.role=='admin'?'<a class="btn s" href="#/admin">Admin</a>':''} <button class="btn g s" onclick="out()">Logout</button>`:`<a class="btn s" href="#/login">Login / Sign up</a>`;route()}
async function out(){await api('logout','POST');U=null;location.hash='#/';boot()}
function card(p){const mt=p.maintenance,oos=!mt&&p.variants&&p.variants.length>0&&p.variants.every(v=>v.out);return`<div class="card pc" onclick="location.hash='#/p/${p.id}'"><div style="position:relative">${p.oldPrice>p.price?`<span class="tag" style="position:absolute;left:8px;top:8px">${Math.round(100-p.price/p.oldPrice*100)}% OFF</span>`:''}<span class="live" style="${mt?'background:#431407;color:#fb923c;border-color:#9a3412':oos?'background:#450a0a;color:#f87171;border-color:#991b1b':''}">${mt?'⏳ UPDATING':oos?'OUT OF STOCK':'● LIVE'}</span><img src="${p.img}" alt="" style="${mt?'opacity:.5;filter:grayscale(.6)':''}"></div><div class="b"><div style="font-weight:700">${esc(p.name)}</div><div class="desc">${esc((p.desc||'').split('\n')[0].slice(0,70))}</div>${p.oldPrice>p.price?`<span class="old">${rs(p.oldPrice)}</span>`:''}<span class="price">${p.variants&&p.variants.length?'From '+rs(Math.min(...p.variants.map(v=>v.price))):rs(p.price)}</span><div class="cb"><button class="btn s o" onclick="event.stopPropagation();demo('${p.id}')">▶ DEMO &amp; SETUP</button><button class="btn s" ${mt||oos?'disabled':''} onclick="event.stopPropagation();location.hash='#/p/${p.id}'">${mt||oos?'UNABLE TO BUY':'BUY NOW'}</button></div></div></div>`}
function demo(id){const p=P.find(x=>x.id==id);if(!p.video){location.hash='#/p/'+id;return}modal(`<h3 style="margin-top:0">${esc(p.name)} — Demo &amp; Setup</h3>${video(p.video)}<br><button class="btn g" onclick="modal()">Close</button>`)}
const pcats=p=>p.categories&&p.categories.length?p.categories:[p.category];
const tabs=()=>{const t=[];if(P.some(p=>p.popular))t.push('POPULAR');t.push('ALL',...new Set(P.flatMap(pcats)));if(P.some(p=>p.maintenance))t.push('UPDATING');return t};
const setCat=i=>{cat=tabs()[i];route()};
const inTab=(p,c)=>c=='ALL'||(c=='POPULAR'?p.popular:c=='UPDATING'?p.maintenance:pcats(p).includes(c));
function shop(q=''){const T=tabs();if(!cat||!T.includes(cat))cat=T[0]=='POPULAR'?'POPULAR':'ALL';
 const L=P.filter(p=>inTab(p,cat)&&p.name.toLowerCase().includes(q)),sec=(h,a)=>`<h3 class="sec">${esc(h)}</h3><div class="grid">${a.map(card).join('')}</div>`;let body='';
 if(cat=='ALL'){const g={};L.forEach(p=>pcats(p).forEach(k=>(g[k]=g[k]||[]).push(p)));body=Object.keys(g).map(k=>sec(k,g[k])).join('')}else if(L.length)body=sec(cat,L);
 return`<div class="tabs">${T.map((c,i)=>`<span class="pill ${c==cat?'on':''}" onclick="setCat(${i})">${c=='UPDATING'?'⏳ ':c=='POPULAR'?'🔥 ':''}${esc(c)}</span>`).join('')}</div>${body||'<p style="color:var(--mu);text-align:center;margin-top:26px">No products here yet.</p>'}`}
const R={
 home:()=>`<div class="hero"><h1>${esc(S.brand)}</h1><p>Premium tools, bots & files. Pay with eSewa, Khalti or Bank — get it in your account.</p><a class="btn" href="#/shop">Browse products</a></div>${shop()}<div id="lo"></div>`,
 shop:()=>`<h1>Shop</h1><input placeholder="Search products…" oninput="$('#sr').innerHTML=shop(this.value.toLowerCase())"><div id="sr">${shop()}</div><div id="lo"></div>`,
 faq:()=>`<h1>FAQ & Tutorials</h1>${FQ.map(f=>`<div class="card" style="padding:16px;margin-bottom:12px"><b>${esc(f.q)}</b><p style="color:var(--mu);white-space:pre-wrap">${esc(f.a)}</p>${video(f.video)}</div>`).join('')||'<p>Nothing here yet.</p>'}`,
 login:()=>`<div class="card" style="max-width:380px;margin:40px auto;padding:20px"><h2 style="margin-top:0" id="lt">Login</h2><div id="nm" style="display:none"><label>Name</label><input id="n"></div><label>Email</label><input id="e" type="email"><label>Password</label><input id="pw" type="password"><div class="err" id="er"></div><button class="btn" style="width:100%" onclick="doAuth()" id="lb">Login</button><p style="text-align:center;color:var(--mu);cursor:pointer" onclick="reg=!reg;$('#nm').style.display=reg?'block':'none';$('#lt').textContent=$('#lb').textContent=reg?'Create account':'Login'">Switch Login / Sign up</p></div>`,
};let reg=false;
async function doAuth(){try{await api(reg?'register':'login','POST',{name:$('#n').value,email:$('#e').value,password:$('#pw').value});await boot();location.hash=U.role=='admin'?'#/admin':'#/account'}catch(e){$('#er').textContent=e.message}}
let sel={};
function product(id){const p=P.find(x=>x.id==id);if(!p)return'<p>Not found</p>';sel={p,v:p.variants?.find(v=>!v.out)};
 return`<div class="two" style="margin-top:24px"><div><img id="mi" src="${gal(p)[0]}" style="width:100%;border-radius:14px">${gal(p).length>1?`<div style="display:flex;gap:8px;margin-top:10px">${gal(p).map(s=>`<img src="${s}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line)" onclick="$('#mi').src=this.src">`).join('')}</div>`:''}</div><div>${p.maintenance?'<span class="tag" style="background:#b45309">🛠 Under maintenance</span>':(p.variants&&p.variants.length&&p.variants.every(v=>v.out))?'<span class="tag" style="background:#b91c1c">OUT OF STOCK</span>':'<span class="tag" style="background:var(--ok)">In stock · Instant after approval</span>'}<h1 style="margin:10px 0">${esc(p.name)}</h1><div class="price" style="font-size:24px" id="pprice"></div>
 ${p.variants?.length?`<p><b>Select option</b><br>${p.variants.map((v,i)=>`<span class="opt ${v.out?'out':i==p.variants.findIndex(x=>!x.out)?'on':''}" ${v.out?'':`onclick="pick(${i},this)"`}>${esc(v.label)} · ${rs(v.price)}${v.out?' <b class="oos">OUT OF STOCK</b>':''}</span>`).join('')}</p>`:''}
 ${p.infoLabel?`<label>${esc(p.infoLabel)} *</label><input id="info" placeholder="Enter your ${esc(p.infoLabel)}">`:''}<label>Your WhatsApp number *</label><input id="wn" placeholder="98XXXXXXXX"><div class="err" id="er"></div>
 ${(p.maintenance||(p.variants&&p.variants.length&&p.variants.every(v=>v.out)))?'<div class="card" style="padding:12px;border-color:#b45309;color:#fbbf24;margin-bottom:10px">'+(p.maintenance?'🛠 This product is under maintenance.':'❌ All options are out of stock.')+' Buying is disabled for now — please check back soon or contact us on WhatsApp.</div><button class="btn" style="width:100%" disabled>UNABLE TO BUY</button>':'<button class="btn" style="width:100%" onclick="buy()">BUY NOW</button>'}${p.video?`<p><button class="btn g" style="width:100%" onclick="showVid()">▶ Setup / Details video</button></p>`:''}</div></div>

 sel.wa=$('#wn').value;sel.info=$('#info')?$('#info').value:'';sel.proof='';pm='';const amt=sel.v?sel.v.price:sel.p.price;

 return`<h1>My profile</h1><div class="card" style="padding:16px"><b style="font-size:18px">${esc(U.name)}</b><br><span style="color:var(--mu)">${esc(U.email)} · Member since ${new Date(U.created).toLocaleDateString()}</span></div><h2>My orders (${o.length}) <small style="color:#22c55e;font-size:12px">● live</small></h2>${o.map(x=>`<div class="card" style="padding:14px;margin-bottom:12px"><div style="display:flex;gap:12px;align-items:center"><img src="${x.img}" width="54" height="54" style="border-radius:8px;object-fit:cover"><div style="flex:1"><b>${esc(x.productName)}</b> ${esc(x.variant)}<br><small style="color:var(--mu)">${x.id} · ${rs(x.price)} · ${new Date(x.created).toLocaleDateString()}</small>${x.info?`<br><small>${esc(x.infoLabel||'Info')}: <b>${esc(x.info)}</b></small>`:''}</div><span class="st ${x.status}">${x.status.toUpperCase()}</span></div>${x.status=='completed'?`${x.fileName?`<p style="margin:12px 0 6px"><b>Your file</b></p><a class="btn" href="/api/orders/${x.id}/download">⬇ Download ${esc(x.fileName)} (${(x.fileSize/1048576).toFixed(1)} MB)</a>${x.filePass?`<p style="margin:10px 0 4px">File password:</p><pre>${esc(x.filePass)}</pre>`:''}`:''}${x.delivery?`<p style="margin:12px 0 4px"><b>Login / key / details</b></p><pre>${esc(x.delivery)}</pre>`:''}`:x.status=='canceled'?'':'<p style="color:var(--mu);margin:10px 0 0">Waiting for payment verification…</p>'}</div>`).join('')||'<p>No orders yet.</p>'}`}

let AT='orders';
async function admin(){if(!U||U.role!='admin'){location.hash='#/login';return''}
 const tabs=['orders','products','faq','settings','users','backup'];let body='';
 if(AT=='orders'){const o=await api('admin/orders');body=o.map(x=>`<div class="card" style="padding:14px;margin-bottom:12px"><b>${x.id}</b> · ${esc(x.productName)} ${esc(x.variant)} · ${rs(x.price)} · ${x.method.toUpperCase()}<br><small>${esc(x.user)} · WhatsApp: <a style="color:var(--ac2)" target="_blank" href="https://wa.me/${x.whatsapp.replace(/\D/g,'')}">${esc(x.whatsapp)}</a> · ${esc(x.infoLabel||'Info')}: <b>${esc(x.info)}</b> · ${new Date(x.created).toLocaleString()}</small>${x.proof?` · <a style="color:var(--ac2)" href="#" onclick="modal('<img src=&quot;'+this.dataset.p+'&quot; style=&quot;width:100%&quot;>');return false" data-p="${x.proof}">View payment proof</a>`:''}
 <select id="s${x.id}">${['pending','processing','completed','canceled'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select><textarea id="d${x.id}" rows="3" placeholder="Delivery: file link, username/password, key, redeem code…">${esc(x.delivery)}</textarea><div style="margin:6px 0 10px;font-size:13px;color:var(--mu)">📎 File: ${x.fileName?`<b style="color:#fff">${esc(x.fileName)}</b> <a href="#" style="color:var(--ac2)" onclick="rmFile('orders','${x.id}');return false">remove</a>`:x.pFile?'using product default file':'none'} · <input type="file" id="f${x.id}" style="width:auto;display:inline;margin:0"> <button class="btn g s" onclick="upFile('orders','${x.id}','f${x.id}')">Upload for this order</button></div><button class="btn s" onclick="saveOrder('${x.id}')">Save</button> <button class="btn g s" style="color:#f87171;border-color:#7f1d1d" onclick="delOrder('${x.id}')">🗑 Delete</button></div>`).join('')||'No orders.'}
 if(AT=='products'){body=`<button class="btn" onclick="prodForm()">+ Add product</button><table style="margin-top:12px">${P.map(p=>`<tr><td><img src="${p.img}" width="40"></td><td>${esc(p.name)}${p.maintenance?' <span class="st" style="background:#b45309">MAINTENANCE</span>':''}<br><small>${esc((p.categories&&p.categories.length?p.categories:[p.category]).join(', '))}</small></td><td>${rs(p.price)}</td><td><button class="btn g s" onclick="prodForm('${p.id}')">Edit</button> <button class="btn g s" onclick="toggleM('${p.id}',${!p.maintenance})">${p.maintenance?'✅ Back online':'🛠 Maintenance'}</button> <button class="btn g s" onclick="delProd('${p.id}')">Delete</button></td></tr>`).join('')}</table>`}
 if(AT=='faq'){body=`<div id="fl">${FQ.map(faqRow).join('')}</div><button class="btn g" onclick="$('#fl').insertAdjacentHTML('beforeend',faqRow({q:'',a:'',video:''}))">+ Add FAQ</button> <button class="btn" onclick="saveFaq()">Save all</button>`}
 if(AT=='settings'){body=`<div style="max-width:520px"><label>Brand name</label><input id="sb" value="${esc(S.brand)}"><label>Logo (replaces default)</label><input type="file" accept="image/*" id="sl"><label>WhatsApp support number</label><input id="sw" value="${esc(S.whatsapp)}"><label>Discord server link</label><input id="sod" placeholder="https://discord.gg/..." value="${esc(S.social?.discord||'')}"><label>TikTok link</label><input id="sot" placeholder="https://tiktok.com/@..." value="${esc(S.social?.tiktok||'')}"><label>YouTube link</label><input id="soy" placeholder="https://youtube.com/@..." value="${esc(S.social?.youtube||'')}"><label>Facebook link</label><input id="sof" placeholder="https://facebook.com/..." value="${esc(S.social?.facebook||'')}"><label>Telegram channel link</label><input id="sote" placeholder="https://t.me/..." value="${esc(S.social?.telegram||'')}"><label>Telegram popup banner picture (optional)</label><input type="file" accept="image/*" id="ppt"><label>Discord popup banner picture (optional — the Discord link is the one above)</label><input type="file" accept="image/*" id="ppd"><p style="color:var(--mu);font-size:12px">Popups appear once a day for each visitor, only when that link is filled in.</p><label>Bank details (shown with Bank option)</label><textarea id="sk" rows="4">${esc(S.bank)}</textarea>${['esewa','khalti','bank'].map(m=>`<label>${m} QR image</label><input type="file" accept="image/*" id="q${m}">`).join('')}<br><button class="btn" onclick="saveSet()">Save settings</button></div>`}
 if(AT=='backup'){body=`<p>Download a copy of all your products, orders, users and settings. Do this every few days and keep the file safe (Google Drive or USB).</p><a class="btn" href="/api/admin/backup">⬇ Download backup</a><p style="color:var(--mu);margin-top:14px">Note: this saves your data. Keep the original files you uploaded for customers on your own computer too.</p>`}
 if(AT=='users'){const u=await api('admin/users');body=`<table>${u.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.role}</td></tr>`).join('')}</table>`}
 return`<h1>Admin panel</h1><div>${tabs.map(t=>`<span class="pill ${t==AT?'on':''}" onclick="AT='${t}';route()">${t.toUpperCase()}</span>`).join('')}</div><div style="margin-top:16px">${body}</div>`}
const faqRow=f=>`<div class="card fr" style="padding:12px;margin-bottom:10px"><input placeholder="Question (e.g. How to buy?)" value="${esc(f.q)}"><textarea rows="2" placeholder="Answer">${esc(f.a)}</textarea><input placeholder="YouTube / video link (optional)" value="${esc(f.video)}"><button class="btn g s" onclick="this.parentNode.remove()">Remove</button></div>`;
async function upFile(kind,id,inp){const f=$('#'+inp).files[0];if(!f)return alert('Choose a file first');modal('<p>Uploading '+esc(f.name)+'… please wait, do not close this page.</p>');
 try{const r=await fetch(`/api/admin/${kind}/${id}/file`,{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Filename':encodeURIComponent(f.name)},body:f});const j=await r.json();if(!r.ok)throw new Error(j.error);await boot();alert('Uploaded ✔')}catch(e){modal();alert(e.message)}}
const toggleM=async(id,on)=>{await api('admin/products/'+id+'/maintenance','PUT',{on});await boot()};
const rmFile=async(k,id)=>{await fetch(`/api/admin/${k}/${id}/file`,{method:'DELETE'});await boot()};
const saveFaq=async()=>{await api('admin/faqs','PUT',[...document.querySelectorAll('.fr')].map(r=>{const i=r.querySelectorAll('input,textarea');return{q:i[0].value,a:i[1].value,video:i[2].value}}));await boot();alert('Saved')};
const delOrder=async id=>{if(!confirm('Delete this order permanently? This cannot be undone.'))return;try{await api('admin/orders/'+id,'DELETE');route()}catch(e){alert(e.message)}};

async function saveSet(){const qr={...S.qr};for(const m of['esewa','khalti','bank']){const f=$('#q'+m).files[0];if(f)qr[m]=await fileData(f)}const popup={...(S.popup||{})},pt=$('#ppt').files[0],pd=$('#ppd').files[0];if(pt)popup.telegram=await fileData(pt);if(pd)popup.discord=await fileData(pd);const f=$('#sl').files[0];
 await api('admin/settings','PUT',{brand:$('#sb').value,logo:f?await fileData(f):S.logo,whatsapp:$('#sw').value,bank:$('#sk').value,qr,popup,social:{telegram:$('#sote').value.trim(),discord:$('#sod').value.trim(),tiktok:$('#sot').value.trim(),youtube:$('#soy').value.trim(),facebook:$('#sof').value.trim()}});await boot();alert('Saved')}
const vRow=v=>`<div class="vrow" style="display:flex;gap:8px"><input placeholder="e.g. 7 DAYS or 10 PCS" value="${esc(v.label)}"><input type="number" placeholder="Price" value="${v.price}" style="max-width:110px"><label style="display:flex;align-items:center;margin:4px 0 10px;white-space:nowrap;color:#f87171;font-size:12px"><input type="checkbox" class="vout" ${v.out?'checked':''} style="width:auto;margin:0 4px 0 0">Out of stock</label><button class="btn g s" type="button" style="margin:4px 0 10px" onclick="this.parentNode.remove()">✕</button></div>`;
function prodForm(id){const p=P.find(x=>x.id==id)||{variants:[]};modal(`<h3 style="margin-top:0">${id?'Edit':'Add'} product</h3><label>Name</label><input id="pn" value="${esc(p.name)}"><label>Categories — separate with commas (e.g. ANDROID NON ROOT, IOS)</label><input id="pc" value="${esc((p.categories&&p.categories.length?p.categories:[p.category||'']).join(', '))}"><label>Price</label><input id="ppr" type="number" value="${p.price||''}"><label>Old price (optional, shows discount)</label><input id="po" type="number" value="${p.oldPrice||''}"><label>Options (days / quantity) — each with its own price</label><div id="vr">${(p.variants||[]).map(vRow).join('')}</div><button class="btn g s" type="button" onclick="$('#vr').insertAdjacentHTML('beforeend',vRow({label:'',price:''}))">+ Add option</button><br><br><label>Photos (up to 3 — leave empty to keep current)</label><input type="file" accept="image/*" id="pi0"><input type="file" accept="image/*" id="pi1"><input type="file" accept="image/*" id="pi2"><label>Required customer field (e.g. Player UID, Guild UID — blank = none)</label><input id="pil" value="${esc(p.infoLabel||'')}"><label>Product file for customers (zip, apk, exe…) ${p.hasFile?'— a file is uploaded; choosing a new one replaces it':''}</label><input type="file" id="pf">${p.hasFile?`<a href="#" style="color:var(--ac2)" onclick="rmFile('products','${id}');modal();return false">remove current file</a>`:''}<label>File password (shown to customer with download; blank = keep current)</label><input id="pfp"><label>Setup video link</label><input id="pvd" value="${esc(p.video||'')}"><label>Description</label><textarea id="pd" rows="5">${esc(p.desc||'')}</textarea><label style="display:block;margin:6px 0;color:#fbbf24"><input type="checkbox" id="ppop" ${p.popular?'checked':''} style="width:auto;margin:0 8px 0 0">🔥 Show in POPULAR tab</label><label style="display:block;margin:6px 0 12px;color:#fbbf24"><input type="checkbox" id="pmt" ${p.maintenance?'checked':''} style="width:auto;margin:0 8px 0 0">🛠 Under maintenance (customers can't buy)</label><button class="btn" onclick="saveProd('${id||''}')">Save</button> <button class="btn g" onclick="modal()">Cancel</button>`)}
async function saveProd(id){const old=P.find(x=>x.id==id)||{},cur=old.imgs&&old.imgs.length?old.imgs:(old.img?[old.img]:[]),imgs=[];for(let i=0;i<3;i++){const f=$('#pi'+i).files[0],s=f?await fileData(f):cur[i];if(s)imgs.push(s)}const variants=[...document.querySelectorAll('.vrow')].map(r=>{const i=r.querySelectorAll('input');return{label:i[0].value.trim(),price:+i[1].value,out:r.querySelector('.vout').checked}}).filter(v=>v.label);
 const r=await api('admin/products','PUT',{id,name:$('#pn').value,category:$('#pc').value,price:$('#ppr').value||(variants[0]?.price||0),oldPrice:$('#po').value,variants,imgs,maintenance:$('#pmt').checked,popular:$('#ppop').checked,infoLabel:$('#pil').value,filePass:$('#pfp').value,video:$('#pvd').value,desc:$('#pd').value});const pf=$('#pf').files[0];if(pf){modal('<p>Uploading file… please wait, do not close this page.</p>');const rr=await fetch(`/api/admin/products/${r.id}/file`,{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Filename':encodeURIComponent(pf.name)},body:pf});if(!rr.ok)alert((await rr.json()).error)}modal();await boot()}
async function route(){modal();clearInterval(liveT);const h=location.hash.slice(2)||'home',[k,a]=h.split('/');let html;
 try{html=k=='p'?product(a):k=='account'?await account():k=='admin'?await admin():(R[k]||R.home)()}catch(e){html='<p>'+esc(e.message)+'</p>'}
 app.innerHTML=html;price();if(location.hash!=lastH){window.scrollTo(0,0);lastH=location.hash}liveOrders();if(k=='account'&&U)liveT=setInterval(pollOrders,4000);if(k=='admin'&&U&&U.role=='admin')liveT=setInterval(pollAdmin,8000)}
let loSig='';const col=s=>'hsl('+([...s].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360)+',55%,42%)';
async function liveOrders(){const el=$('#lo');if(!el)return;try{const d=await api('live-orders'),sig=JSON.stringify(d.map(x=>x.at+x.name)),fresh=loSig!==''&&sig!=loSig;loSig=sig;
 el.innerHTML=d.length?`<h3 class="sec">⚡ LIVE ORDERS</h3><div class="lo">${d.map((x,i)=>`<div class="lo-item ${fresh&&i==0?'new':''}"><div class="av" style="background:${col(x.name)}">${esc(x.name.slice(0,2).toUpperCase())}</div><div style="flex:1;min-width:0"><b>${esc(x.name)}</b><div class="lp">${esc(x.product)}${x.variant?' · <span class="vtag">'+esc(x.variant)+'</span>':''}</div></div><div style="text-align:right"><span class="done">COMPLETED</span><div class="price" style="margin-top:4px">${rs(x.price)}</div></div></div>`).join('')}</div>`:''}catch(e){}}
setInterval(()=>{if($('#lo'))liveOrders()},30000);
let ppQ=[],ppCur='';const ppMem={};
const ppSeen=k=>{try{return Date.now()-(+localStorage.getItem('pp_'+k)||0)<864e5}catch(e){return ppMem[k]}};
const ppMark=k=>{ppMem[k]=1;try{localStorage.setItem('pp_'+k,Date.now())}catch(e){}};
function popups(){if(location.hash.startsWith('#/admin'))return;const sw=S.social||{};ppQ=['telegram','discord'].filter(k=>/^https?:/.test(sw[k]||'')&&!ppSeen(k));nextPP()}
function nextPP(){const k=ppQ.shift();ppCur=k||'';if(!k){$('#pp').innerHTML='';return}
 const T={telegram:['Join our Telegram Channel','Get instant updates on new releases, offers and announcements before everyone else.','Join Telegram Channel','linear-gradient(135deg,#2aabee,#1e88c8)'],discord:['Join our Discord Community','Chat with our team and other members, get help, and never miss an update.','Join Discord Server','linear-gradient(135deg,#6d79ff,#4752c4)']}[k],im=(S.popup||{})[k],sw=S.social[k];
 $('#pp').innerHTML=`<div class="pb"><button class="px" aria-label="Close" onclick="closeCur()">✕</button><div class="ph ${im?'im':''}" style="background:${T[3]}">${im?`<img src="${esc(im)}" alt="">`:SOC[k][2]}</div><div class="pt"><h3>${T[0]}</h3><p>${T[1]}</p><a class="go" style="background:${T[3]}" href="${esc(sw)}" target="_blank" rel="noopener" onclick="closeCur()">${T[2]} →</a></div></div>`}
function closeCur(){if(ppCur)ppMark(ppCur);setTimeout(nextPP,350);$('#pp').innerHTML=''}
addEventListener('keydown',e=>{if(e.key=='Escape'&&ppCur)closeCur()});
addEventListener('hashchange',route);boot().then(()=>setTimeout(popups,1500));
</script></body></html>
